<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter</title>
    <link rel="stylesheet" href="css.css" />
  </head>
  <body>
    <header>Counter</header>
    <div>
      <span>Counter value: </span>  
      <br />
      <span id="count">0</span>
      <br />
      <button class="plusOneButton" onclick="Plus(1)">+</button>
      <button class="plusOneButton" onclick="Minus(1)">-</button>
      <br />
      <button class="plusTenButton" onclick="Plus(10)">+10</button>
      <button class="plusTenButton" onclick="Minus(10)">-10</button>
    </div>
  </body>
</html>
<script>
  const count = document.getElementById("count");
  const Plus = (num) => {
    count.textContent = parseInt(count.textContent) + parseInt(num);
  };
  const Minus = (num) => {
    count.textContent = parseInt(count.textContent) - parseInt(num);
  };
</script>
