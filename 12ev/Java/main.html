<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .table-container {
            width: 90%;
            max-width: 1000px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
        }

        thead {
            background-color: #009879;
            color: #ffffff;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid #dddddd;
        }

        tbody tr:nth-of-type(even) {
            background-color: #f3f3f3;
        }

        tbody tr:last-of-type {
            border-bottom: 2px solid #009879;
        }

        tbody tr:hover {
            background-color: #e1f5fe;
            cursor: default;
        }

        #status-message {
            text-align: center;
            padding: 20px;
            font-weight: bold;
            color: #666;
        }

        .error {
            color: #d9534f !important;
        }
    </style>
</head>
<body>

    <div class="table-container">
        <h1>User List</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="user-table-body">
            </tbody>
        </table>
        <div id="status-message">Loading data...</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchUsers();
        });

        async function fetchUsers() {
            const tableBody = document.getElementById("user-table-body");
            const statusMessage = document.getElementById("status-message");

            try {
                const response = await fetch('https://surveys-5jvt.onrender.com/api/users/');

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const users = await response.json();

                statusMessage.style.display = 'none';

                const fragment = document.createDocumentFragment();

                users.forEach(user => {
                    const row = document.createElement("tr");

                    const cellId = createCell(user.id);
                    const cellFirst = createCell(user.firstName);
                    const cellLast = createCell(user.lastName);
                    const cellEmail = createCell(user.email);

                    row.appendChild(cellId);
                    row.appendChild(cellFirst);
                    row.appendChild(cellLast);
                    row.appendChild(cellEmail);

                    fragment.appendChild(row);
                });

                tableBody.appendChild(fragment);

            } catch (error) {
                console.error(error);
                statusMessage.textContent = "Failed to load data. Please try again later.";
                statusMessage.classList.add("error");
            }
        }

        function createCell(text) {
            const td = document.createElement("td");
            td.textContent = text;
            return td;
        }
    </script>
</body>
</html>
