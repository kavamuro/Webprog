<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css.css">
    <title>Hotel Szobafoglaló</title>
</head>
<body>

    <div class="container">
        <h1>Szobafoglalás Kezelő</h1>

        <div class="form-card">
            <input type="hidden" id="editId">

            <div class="form-group">
                <label for="szobaNev">Szoba Neve / Száma</label>
                <input type="text" id="szobaNev" placeholder="Pl. 104-es szoba">
            </div>

            <div class="form-group">
                <label for="vendegNev">Vendég Neve (Csak betűk!)</label>
                <input type="text" id="vendegNev" placeholder="Pl. Kiss János" oninput="csakBetu(this)">
                <div id="nevHiba" class="error-msg">A név csak betűket tartalmazhat!</div>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label for="szobaMeret">Méret (m²)</label>
                    <input type="number" id="szobaMeret" placeholder="20" min="1" oninput="csakPozitiv(this)">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="agyakSzama">Ágyak száma</label>
                    <input type="number" id="agyakSzama" placeholder="2" min="1" oninput="csakPozitiv(this)">
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-primary" onclick="mentes()">Hozzáadás / Mentés</button>
                <button class="btn-danger" onclick="urlapTorlese()">Mégse</button>
            </div>
        </div>

        <div id="szobaLista" class="room-list"></div>

        <button class="btn-danger-fill" onclick="osszesTorlese()">Összes adat törlése</button>
    </div>

    <script>
        let szobak = [];
        
        function generalId() {
            return Date.now().toString();
        }




        function csakBetu(input) {
            input.value = input.value.replace(/[^a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ\s]/g, '');
        }

   
        function csakPozitiv(input) {
            if (input.value < 0) {
                input.value = Math.abs(input.value); // Pozitívvá teszi
            }
        }


        function render() {
            const listaElem = document.getElementById('szobaLista');
            listaElem.innerHTML = '';

            if (szobak.length === 0) {
                listaElem.innerHTML = '<p class="empty-msg">Nincs rögzített foglalás.</p>';
                return;
            }

            szobak.forEach(szoba => {
                const kartya = document.createElement('div');
                kartya.className = 'room-card';
                
                kartya.innerHTML = `
                    <div class="room-info">
                        <h3>${szoba.szobaNev} <small>(${szoba.vendegNev})</small></h3>
                        <div class="room-details">
                            Méret: <strong>${szoba.szobaMeret} m²</strong> | 
                            Ágyak: <strong>${szoba.agyakSzama} db</strong>
                        </div>
                    </div>
                    <div class="room-actions">
                        <button class="btn-primary btn-sm" onclick="szerkesztes('${szoba.id}')">Módosít</button>
                        <button class="btn-danger btn-sm" onclick="torles('${szoba.id}')">Törlés</button>
                    </div>
                `;
                listaElem.appendChild(kartya);
            });
        }

   
        function mentes() {
            const idInput = document.getElementById('editId').value;
            const nevInput = document.getElementById('szobaNev').value;
            const vendegInput = document.getElementById('vendegNev').value;
            const meretInput = document.getElementById('szobaMeret').value;
            const agyakInput = document.getElementById('agyakSzama').value;

            if(nevInput === '' || vendegInput === '' || meretInput === '' || agyakInput === '') {
                alert("Kérlek tölts ki minden mezőt!");
                return;
            }

       
            if (Number(meretInput) <= 0 || Number(agyakInput) <= 0) {
                alert("A szoba mérete és az ágyak száma csak pozitív szám lehet (nagyobb mint 0)!");
                return;
            }


            const betuMinta = /^[a-zA-ZáéíóöőúüűÁÉÍÓÖŐÚÜŰ\s]+$/;
            if (!betuMinta.test(vendegInput)) {
                alert("A név mező nem tartalmazhat számokat vagy speciális karaktereket!");
                return;
            }

            if (idInput) {

                const index = szobak.findIndex(x => x.id === idInput);
                if (index > -1) {
                    szobak[index].szobaNev = nevInput;
                    szobak[index].vendegNev = vendegInput;
                    szobak[index].szobaMeret = meretInput;
                    szobak[index].agyakSzama = agyakInput;
                }
            } else {
 
                const ujSzoba = {
                    id: generalId(),
                    szobaNev: nevInput,
                    vendegNev: vendegInput,
                    szobaMeret: meretInput,
                    agyakSzama: agyakInput
                };
                szobak.push(ujSzoba);
            }

            urlapTorlese();
            render();
        }

        function torles(id) {
            if(confirm("Biztosan törölni szeretnéd ezt a foglalást?")) {
                szobak = szobak.filter(szoba => szoba.id !== id);
                render();
            }
        }

        function szerkesztes(id) {
            const szoba = szobak.find(x => x.id === id);
            if (szoba) {
                document.getElementById('editId').value = szoba.id;
                document.getElementById('szobaNev').value = szoba.szobaNev;
                document.getElementById('vendegNev').value = szoba.vendegNev;
                document.getElementById('szobaMeret').value = szoba.szobaMeret;
                document.getElementById('agyakSzama').value = szoba.agyakSzama;
                window.scrollTo(0,0);
            }
        }

        function osszesTorlese() {
            if(szobak.length > 0 && confirm("MINDEN adatot törölni fogsz. Biztos vagy benne?")) {
                szobak = [];
                render();
                urlapTorlese();
            }
        }

        function urlapTorlese() {
            document.getElementById('editId').value = '';
            document.getElementById('szobaNev').value = '';
            document.getElementById('vendegNev').value = '';
            document.getElementById('szobaMeret').value = '';
            document.getElementById('agyakSzama').value = '';
        }

        render();
    </script>
</body>
</html>
